{% load socialaccount %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Expense Tracker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f3f6fb;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 30px;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
        }

        h1 {
            margin-top: 0;
            text-align: center;
            color: #1f2937;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 25px;
        }

        form p {
            margin-bottom: 16px;
        }

        form label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: bold;
        }

        form input {
            width: 100%;
            padding: 11px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
        }

        form input:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            color: #6b7280;
        }

        a {
            color: #2563eb;
        }


        .google-login {
    margin-top: 20px;
    text-align: center;
}

.google-btn {
    width: 100%;
    padding: 12px;
    background: white;
    color: #333;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 15px;
    cursor: pointer;
}

.google-btn:hover {
    background: #f5f5f5;
}
    </style>
</head>

<body>
    <div class="login-card">
        <h1>Welcome Back</h1>
        <p class="subtitle">Login to your Expense Tracker</p>

        {% if form.errors %}
            <p style="color: red;">
                Invalid username or password.
            </p>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Login</button>
        </form>

        <div class="google-login">
    <p>Or</p>

    <form method="post" action="{% provider_login_url 'google' %}">
        {% csrf_token %}
        <button type="submit" class="google-btn">
            Continue with Google
        </button>
    </form>
</div>

        <p class="footer">
            Don't have an account?
            <a href="{% url 'register' %}">Register</a>
        </p>
    </div>
</body>
</html>
